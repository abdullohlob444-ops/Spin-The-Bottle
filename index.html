
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spin the Bottle Online</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17120f;color:#fff;font-family:Arial,sans-serif;text-align:center}
main{max-width:520px;margin:auto;padding:18px}
h1{color:#f5d29b;font-size:27px}
input,button{font-size:16px;padding:13px;border-radius:12px;border:0;width:100%;margin:5px 0}
input{background:#fff;color:#222}
button{background:#e6b56b;color:#24180d;font-weight:bold}
button:disabled{opacity:.45}
.panel{background:#302117;border:1px solid #725035;border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
#table{position:relative;height:280px;border-radius:50%;border:12px solid #694323;background:radial-gradient(ellipse,#98643a,#54321e 75%);display:flex;align-items:center;justify-content:center;margin:18px auto}
#bottle{font-size:100px;transition:transform 1s ease;filter:drop-shadow(0 5px 5px #222)}
#players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.player{background:#493321;border-radius:12px;padding:10px;min-width:90px;max-width:45%;overflow-wrap:anywhere}
.avatar{font-size:28px}
#status{color:#f5d29b;min-height:24px}
.small{font-size:13px;color:#d6c5b4}
</style>
</head>
<body>
<main>
<h1>🍾 Spin the Bottle</h1>
<div class="panel">
<input id="name" maxlength="24" placeholder="O‘yin ichidagi niking">
<div class="row">
<button id="create">Xona yaratish</button>
<button id="join">Xonaga kirish</button>
</div>
<input id="roomCode" maxlength="6" placeholder="6 xonali xona kodi">
<div id="status">Ulanmoqda...</div>
<div class="small" id="roomInfo">Avval nik yozing, so‘ng xona yarating yoki kod bilan kiring.</div>
</div>
<div class="panel">
<div id="table"><div id="bottle">🍾</div></div>
<button id="spin" disabled>🍾 Shishani aylantirish</button>
<div id="result">Natija shu yerda chiqadi</div>
</div>
<div class="panel">
<h3>👥 Xonadagi o‘yinchilar</h3>
<div id="players">Hozircha xona tanlanmagan</div>
</div>
</main>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbP394I5evBp6z2pKmryax079TzhPDUFs",
  authDomain: "spinthe-bottle.firebaseapp.com",
  databaseURL: "https://spinthe-bottle-default-rtdb.firebaseio.com",
  projectId: "spinthe-bottle",
  storageBucket: "spinthe-bottle.firebasestorage.app",
  messagingSenderId: "445782145636",
  appId: "1:445782145636:web:1b8cb154bc1d0bc3333d71",
  measurementId: "G-Q3FWDD25N6"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) tg.ready();

let me = null, room = null, roomListener = null;
let playersNow = {};
const $ = id => document.getElementById(id);
function status(s){ $("status").textContent=s; }
function getName(){
  const n=$("name").value.trim();
  if(!n){status("Avval nikingizni yozing.");return null;}
  return n;
}
function randomCode(){
  return String(Math.floor(100000+Math.random()*900000));
}

auth.signInAnonymously().then(cred=>{
  me=cred.user;
  status("Ulandi! Nik yozib, xona yarating yoki kod kiriting.");
  $("create").disabled=false;
  $("join").disabled=false;
}).catch(e=>{
  status("Ulanish xatosi: "+e.message);
});

async function enterRoom(code,n){
  const ref=db.ref("rooms/"+code);
  const snap=await ref.once("value");
  if(!snap.exists()) throw new Error("Bunday xona topilmadi.");
  if(roomListener && room) db.ref("rooms/"+room).off("value",roomListener);
  room=code;
  $("roomCode").value=code;
  $("roomInfo").textContent="Xona kodi: "+code+" — do‘stlaringizga yuboring.";
  const playerRef=ref.child("players/"+me.uid);
  await playerRef.set({name:n,joinedAt:firebase.database.ServerValue.TIMESTAMP});
  playerRef.onDisconnect().remove();
  roomListener=snap=>{
    const data=snap.val()||{};
    playersNow=data.players||{};
    const box=$("players");
    box.replaceChildren();
    const entries=Object.entries(playersNow);
    if(!entries.length) box.textContent="O‘yinchilar kutilmoqda...";
    entries.forEach(([uid,p])=>{
      const card=document.createElement("div");
      card.className="player";
      const avatar=document.createElement("div");
      avatar.className="avatar";
      avatar.textContent="🙂";
      const label=document.createElement("div");
      label.textContent=p.name+(uid===me.uid?" (siz)":"");
      card.append(avatar,label);
      box.append(card);
    });
    if(data.spin && data.spin.at){
      const res=$("result");
      res.textContent="🎯 Tanlandi: "+data.spin.targetName;
      res.dataset.at=data.spin.at;
    }
    $("spin").disabled=entries.length<2;
  };
  ref.on("value",roomListener);
  status("Xonaga muvaffaqiyatli kirdingiz!");
}

$("create").onclick=async()=>{
  if(!me)return status("Ulanish kutilmoqda...");
  const n=getName(); if(!n)return;
  $("create").disabled=true;
  try{
    let code,created=false;
    for(let i=0;i<5;i++){
      code=randomCode();
      const r=db.ref("rooms/"+code);
      const snap=await r.once("value");
      if(!snap.exists()){
        await r.set({createdAt:firebase.database.ServerValue.TIMESTAMP,players:{},spin:null});
        created=true;break;
      }
    }
    if(!created) throw new Error("Xona yaratilmadi. Qayta urinib ko‘ring.");
    await enterRoom(code,n);
  }catch(e){status(e.message);}
  finally{$("create").disabled=false;}
};

$("join").onclick=async()=>{
  if(!me)return status("Ulanish kutilmoqda...");
  const n=getName(); if(!n)return;
  const code=$("roomCode").value.trim();
  if(!/^\d{6}$/.test(code))return status("6 xonali xona kodini kiriting.");
  $("join").disabled=true;
  try{await enterRoom(code,n);}
  catch(e){status(e.message);}
  finally{$("join").disabled=false;}
};

$("spin").onclick=async()=>{
  if(!room || !me)return;
  const list=Object.entries(playersNow);
  if(list.length<2)return status("Kamida 2 o‘yinchi kerak.");
  $("spin").disabled=true;
  try{
    const chosen=list[Math.floor(Math.random()*list.length)];
    const targetName=chosen[1].name;
    await db.ref("rooms/"+room+"/spin").set({
      targetUid:chosen[0],
      targetName:targetName,
      by:me.uid,
      at:Date.now()
    });
    $("bottle").style.transform="rotate("+(720+Math.random()*1080)+"deg)";
    status("Shisha aylandi!");
  }catch(e){status("Xatolik: "+e.message);}
  finally{$("spin").disabled=Object.keys(playersNow).length<2;}
};
$("create").disabled=true;
$("join").disabled=true;
</script>
</body>
</html>
