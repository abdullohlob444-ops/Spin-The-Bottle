
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Spin the Bottle</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:24px 18px;
 font-family:Arial,sans-serif;color:#fff;
 background:radial-gradient(circle at top,#243c35,#101713 65%);
 text-align:center
}
h1{font-size:30px;margin:12px 0 6px}
p{color:#b5c9bf}
.arena{
 width:270px;height:270px;max-width:85vw;
 margin:28px auto;position:relative;
 border:2px solid #6ee7a1;border-radius:50%;
 background:radial-gradient(circle,#244e3b,#14271f);
 box-shadow:0 0 30px #37d78322;
 display:grid;place-items:center
}
.bottle{
 font-size:120px;display:inline-block;
 transform:rotate(0deg);
 transition:transform 3.5s cubic-bezier(.12,.75,.12,1);
 filter:drop-shadow(0 8px 8px #0008)
}
input{
 width:68%;padding:13px;border-radius:12px;
 border:1px solid #426b56;background:#192a22;
 color:white;font-size:16px;outline:none
}
button{
 padding:13px 18px;border:0;border-radius:12px;
 background:#59e69a;color:#10271a;
 font-size:15px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.add{margin-left:5px}
ul{padding:0;list-style:none;max-width:350px;margin:20px auto}
li{
 display:flex;justify-content:space-between;align-items:center;
 background:#1b2b23;padding:12px;margin:8px 0;
 border-radius:10px
}
li button{padding:6px 10px;background:#35483d;color:white}
#result{font-size:21px;font-weight:bold;color:#78f5ae;min-height:30px}
#spin{width:min(350px,100%);padding:16px;font-size:17px}
.small{font-size:13px}
</style>
</head>
<body>
<h1>🍾 Spin the Bottle</h1>
<p>Do‘stlaringni qo‘sh va shishani aylantir!</p>

<div class="arena">
  <div class="bottle" id="bottle">🍾</div>
</div>

<div>
  <input id="name" maxlength="24"
   placeholder="O‘yinchi ismini yoz">
  <button class="add" id="add">+</button>
</div>

<ul id="players"></ul>
<div id="result">O‘yinchilarni qo‘shing!</div>
<br>
<button id="spin">🍾 SHISHANI AYLANTIRISH</button>
<p class="small">Kamida 2 ta o‘yinchi kerak</p>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const $ = id => document.getElementById(id);
let players = [];
let angle = 0;
let busy = false;
let previous = -1;

function render(){
  $("players").innerHTML = "";
  players.forEach((name,i)=>{
    const li = document.createElement("li");
    const label = document.createElement("span");
    label.textContent = (i+1)+". "+name;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.setAttribute("aria-label",name+" ni o‘chirish");
    del.onclick = ()=>{
      if(busy) return;
      players.splice(i,1);
      if(previous===i) previous=-1;
      else if(previous>i) previous--;
      render();
    };
    li.append(label,del);
    $("players").append(li);
  });
  $("spin").disabled = busy || players.length<2;
}

function addPlayer(){
  if(busy) return;
  const name = $("name").value.trim();
  if(!name) return;
  if(players.some(p=>p.toLocaleLowerCase()===name.toLocaleLowerCase())){
    $("result").textContent="Bu ism ro‘yxatda bor!";
    return;
  }
  if(players.length>=20){
    $("result").textContent="Maksimum 20 ta o‘yinchi!";
    return;
  }
  players.push(name);
  $("name").value="";
  $("result").textContent="O‘yinchi qo‘shildi!";
  render();
}

$("add").onclick = addPlayer;
$("name").addEventListener("keydown",e=>{
  if(e.key==="Enter") addPlayer();
});

$("spin").onclick = ()=>{
  if(busy || players.length<2) return;
  busy = true;
  render();
  $("result").textContent="Shisha aylanmoqda...";

  let index;
  do {
    index = Math.floor(Math.random()*players.length);
  } while(index===previous);

  previous = index;
  angle += 360*5 + Math.random()*360;
  $("bottle").style.transform=`rotate(${angle}deg)`;

  setTimeout(()=>{
    $("result").textContent="🎯 Tanlandi: "+players[index]+"!";
    busy = false;
    render();
    tg?.HapticFeedback?.notificationOccurred("success");
  },3600);
};

render();
</script>
</body>
</html>
